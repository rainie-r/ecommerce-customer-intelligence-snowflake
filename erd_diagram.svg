<svg viewBox="0 0 1400 820" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1400" height="820" fill="#ffffff"/>

  <!-- Title -->
  <text x="700" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a2e">E-Commerce Customer Intelligence — Data Model</text>
  <text x="700" y="64" text-anchor="middle" font-size="13" fill="#666">raw schema — 8 tables loaded from Olist dataset</text>

  <!-- CUSTOMERS -->
  <g>
    <rect x="60" y="110" width="230" height="150" rx="6" fill="#eef4ff" stroke="#3b6fd4" stroke-width="1.5"/>
    <rect x="60" y="110" width="230" height="34" rx="6" fill="#3b6fd4"/>
    <text x="175" y="133" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">customers</text>
    <text x="75" y="162" font-size="12" fill="#1a1a2e">PK  customer_id</text>
    <text x="75" y="182" font-size="12" fill="#1a1a2e">     customer_unique_id *</text>
    <text x="75" y="202" font-size="12" fill="#333">     customer_city</text>
    <text x="75" y="222" font-size="12" fill="#333">     customer_state</text>
    <text x="75" y="242" font-size="12" fill="#333">     customer_zip_code_prefix</text>
  </g>

  <!-- ORDERS -->
  <g>
    <rect x="380" y="110" width="230" height="190" rx="6" fill="#eef4ff" stroke="#3b6fd4" stroke-width="1.5"/>
    <rect x="380" y="110" width="230" height="34" rx="6" fill="#3b6fd4"/>
    <text x="495" y="133" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">orders</text>
    <text x="395" y="162" font-size="12" fill="#1a1a2e">PK  order_id</text>
    <text x="395" y="182" font-size="12" fill="#1a1a2e">FK  customer_id</text>
    <text x="395" y="202" font-size="12" fill="#333">     order_status</text>
    <text x="395" y="222" font-size="12" fill="#333">     order_purchase_timestamp</text>
    <text x="395" y="242" font-size="12" fill="#333">     order_approved_at</text>
    <text x="395" y="262" font-size="12" fill="#333">     order_delivered_carrier_date</text>
    <text x="395" y="282" font-size="12" fill="#333">     order_delivered_customer_date</text>
  </g>

  <!-- ORDER_ITEMS -->
  <g>
    <rect x="700" y="110" width="230" height="170" rx="6" fill="#eef4ff" stroke="#3b6fd4" stroke-width="1.5"/>
    <rect x="700" y="110" width="230" height="34" rx="6" fill="#3b6fd4"/>
    <text x="815" y="133" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">order_items</text>
    <text x="715" y="162" font-size="12" fill="#1a1a2e">PK  order_id + order_item_id</text>
    <text x="715" y="182" font-size="12" fill="#1a1a2e">FK  product_id</text>
    <text x="715" y="202" font-size="12" fill="#1a1a2e">FK  seller_id</text>
    <text x="715" y="222" font-size="12" fill="#333">     price</text>
    <text x="715" y="242" font-size="12" fill="#333">     freight_value</text>
    <text x="715" y="262" font-size="12" fill="#333">     shipping_limit_date</text>
  </g>

  <!-- PRODUCTS -->
  <g>
    <rect x="1020" y="70" width="230" height="150" rx="6" fill="#eef4ff" stroke="#3b6fd4" stroke-width="1.5"/>
    <rect x="1020" y="70" width="230" height="34" rx="6" fill="#3b6fd4"/>
    <text x="1135" y="93" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">products</text>
    <text x="1035" y="122" font-size="12" fill="#1a1a2e">PK  product_id</text>
    <text x="1035" y="142" font-size="12" fill="#333">     product_category_name</text>
    <text x="1035" y="162" font-size="12" fill="#333">     product_weight_g</text>
    <text x="1035" y="182" font-size="12" fill="#333">     product_length/height/width_cm</text>
  </g>

  <!-- SELLERS -->
  <g>
    <rect x="1020" y="250" width="230" height="120" rx="6" fill="#eef4ff" stroke="#3b6fd4" stroke-width="1.5"/>
    <rect x="1020" y="250" width="230" height="34" rx="6" fill="#3b6fd4"/>
    <text x="1135" y="273" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">sellers</text>
    <text x="1035" y="302" font-size="12" fill="#1a1a2e">PK  seller_id</text>
    <text x="1035" y="322" font-size="12" fill="#333">     seller_city</text>
    <text x="1035" y="342" font-size="12" fill="#333">     seller_state</text>
  </g>

  <!-- PRODUCT_CATEGORY_TRANSLATION -->
  <g>
    <rect x="1020" y="400" width="230" height="100" rx="6" fill="#eef4ff" stroke="#3b6fd4" stroke-width="1.5"/>
    <rect x="1020" y="400" width="230" height="34" rx="6" fill="#3b6fd4"/>
    <text x="1135" y="423" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">product_category_translation</text>
    <text x="1035" y="452" font-size="12" fill="#1a1a2e">PK  product_category_name</text>
    <text x="1035" y="472" font-size="12" fill="#333">     product_category_name_english</text>
  </g>

  <!-- ORDER_PAYMENTS -->
  <g>
    <rect x="380" y="360" width="230" height="130" rx="6" fill="#fff4e6" stroke="#d48b3b" stroke-width="1.5"/>
    <rect x="380" y="360" width="230" height="34" rx="6" fill="#d48b3b"/>
    <text x="495" y="383" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">order_payments</text>
    <text x="395" y="412" font-size="12" fill="#1a1a2e">PK  order_id + payment_sequential</text>
    <text x="395" y="432" font-size="12" fill="#333">     payment_type</text>
    <text x="395" y="452" font-size="12" fill="#333">     payment_installments</text>
    <text x="395" y="472" font-size="12" fill="#333">     payment_value</text>
  </g>

  <!-- ORDER_REVIEWS -->
  <g>
    <rect x="380" y="530" width="230" height="130" rx="6" fill="#fff4e6" stroke="#d48b3b" stroke-width="1.5"/>
    <rect x="380" y="530" width="230" height="34" rx="6" fill="#d48b3b"/>
    <text x="495" y="553" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">order_reviews</text>
    <text x="395" y="582" font-size="12" fill="#1a1a2e">PK  review_id + order_id **</text>
    <text x="395" y="602" font-size="12" fill="#333">     review_score</text>
    <text x="395" y="622" font-size="12" fill="#333">     review_creation_date</text>
    <text x="395" y="642" font-size="12" fill="#333">     review_answer_timestamp</text>
  </g>

  <!-- Relationship lines -->
  <!-- customers -> orders -->
  <line x1="290" y1="185" x2="380" y2="185" stroke="#555" stroke-width="1.5"/>
  <text x="300" y="178" font-size="16" fill="#555">1</text>
  <text x="360" y="178" font-size="16" fill="#555">M</text>

  <!-- orders -> order_items -->
  <line x1="610" y1="185" x2="700" y2="185" stroke="#555" stroke-width="1.5"/>
  <text x="620" y="178" font-size="16" fill="#555">1</text>
  <text x="680" y="178" font-size="16" fill="#555">M</text>

  <!-- order_items -> products -->
  <line x1="930" y1="155" x2="1020" y2="140" stroke="#555" stroke-width="1.5"/>
  <text x="940" y="145" font-size="16" fill="#555">M</text>
  <text x="1005" y="132" font-size="16" fill="#555">1</text>

  <!-- order_items -> sellers -->
  <line x1="930" y1="230" x2="1020" y2="300" stroke="#555" stroke-width="1.5"/>
  <text x="940" y="245" font-size="16" fill="#555">M</text>
  <text x="1000" y="295" font-size="16" fill="#555">1</text>

  <!-- products -> category translation -->
  <line x1="1135" y1="220" x2="1135" y2="400" stroke="#555" stroke-width="1.5"/>
  <text x="1145" y="240" font-size="16" fill="#555">M</text>
  <text x="1145" y="390" font-size="16" fill="#555">1</text>

  <!-- orders -> order_payments -->
  <line x1="495" y1="300" x2="495" y2="360" stroke="#555" stroke-width="1.5"/>
  <text x="505" y="320" font-size="16" fill="#555">1</text>
  <text x="505" y="352" font-size="16" fill="#555">M</text>

  <!-- orders -> order_reviews -->
  <path d="M 380 250 Q 200 400 380 545" fill="none" stroke="#555" stroke-width="1.5"/>
  <text x="230" y="400" font-size="16" fill="#555">1</text>
  <text x="360" y="530" font-size="16" fill="#555">M</text>

  <!-- Legend -->
  <g>
    <rect x="60" y="700" width="14" height="14" fill="#eef4ff" stroke="#3b6fd4"/>
    <text x="82" y="712" font-size="12" fill="#333">core transactional tables</text>

    <rect x="60" y="725" width="14" height="14" fill="#fff4e6" stroke="#d48b3b"/>
    <text x="82" y="737" font-size="12" fill="#333">supplementary tables (payments, reviews)</text>

    <text x="60" y="762" font-size="12" fill="#333">*  customer_unique_id is the persistent customer key used for all customer-level analysis (RFM, cohorts) — customer_id changes per order</text>
    <text x="60" y="782" font-size="12" fill="#333">** review_id alone is NOT unique — one review can map to multiple order_ids from the same checkout session (see data quality findings)</text>
  </g>
</svg>
